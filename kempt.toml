  [[packages.way-of-working.symlink]]
  from = "skills/test-driven-development"
  to = "~/.pi/agent/skills/test-driven-development"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/systematic-debugging"
  to = "~/.claude/skills/systematic-debugging"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/systematic-debugging"
  to = "~/.pi/agent/skills/systematic-debugging"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/receiving-code-review"
  to = "~/.claude/skills/receiving-code-review"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/receiving-code-review"
  to = "~/.pi/agent/skills/receiving-code-review"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/remembering"
  to = "~/.claude/skills/remembering"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/remembering"
  to = "~/.pi/agent/skills/remembering"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/running-long-jobs"
  to = "~/.claude/skills/running-long-jobs"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/running-long-jobs"
  to = "~/.pi/agent/skills/running-long-jobs"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/pi-subagent-dispatch"
  to = "~/.claude/skills/pi-subagent-dispatch"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/pi-subagent-dispatch"
  to = "~/.pi/agent/skills/pi-subagent-dispatch"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/cleaning-up-branches"
  to = "~/.claude/skills/cleaning-up-branches"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/cleaning-up-branches"
  to = "~/.pi/agent/skills/cleaning-up-branches"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/driving-chrome"
  to = "~/.claude/skills/driving-chrome"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/driving-chrome"
  to = "~/.pi/agent/skills/driving-chrome"
  backup = true

  [[packages.way-of-working.verify]]
  symlink-target = { link = "~/.pi/agent/APPEND_SYSTEM.md", target = "way-of-working.md" }

