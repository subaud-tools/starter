needs = ["core"]

  [[packages.tackle.download]]
  site = "tackle.tools"
  product = "tackle"
  tool = "proj"
  bin = "proj"
  setup = true

  [[packages.tackle.download]]
  site = "tackle.tools"
  product = "tackle"
  tool = "scratch"
  bin = "scratch"

  [[packages.tackle.download]]
  site = "tackle.tools"
  product = "tackle"
  tool = "creel"
  bin = "creel"

  [[packages.tackle.download]]
  site = "tackle.tools"
  product = "tackle"
  tool = "sift"
  bin = "sift"
  setup = true

  [[packages.tackle.download]]
  site = "tackle.tools"
  product = "tackle"
  tool = "imprint"
  bin = "imprint"
  setup = true

  [[packages.tackle.download]]
  site = "tackle.tools"
  product = "tackle"
  tool = "cull"
  bin = "cull"
  setup = true

  [[packages.tackle.verify]]
  command-exists = "proj"

  [[packages.tackle.verify]]
  command-exists = "scratch"

  [[packages.tackle.verify]]
  command-exists = "creel"

  [[packages.tackle.verify]]
  command-exists = "sift"

  [[packages.tackle.verify]]
  command-exists = "imprint"

  [[packages.tackle.verify]]
  command-exists = "cull"

[packages.casebook]
description = "casebook: triage your repos, branches and PRs with your agent (casebook.tools)"
needs = ["core"]

  [[packages.casebook.download]]
  site = "casebook.tools"
  tool = "casebook"
  bin = "casebook"
  setup = true

  [[packages.casebook.verify]]
  command-exists = "casebook"

[packages.muda]
description = "muda: find and fix delivery waste in your pipelines (muda.tools)"
needs = ["core"]

  [[packages.muda.download]]
  site = "muda.tools"
  tool = "muda"
  bin = "muda"
  setup = true

  [[packages.muda.verify]]
  command-exists = "muda"

[packages.diazo]
description = "diazo: plan a change with your agent on a shared page (diazo.tools)"
needs = ["core"]

  [[packages.diazo.download]]
  site = "diazo.tools"
  tool = "diazo"
  bin = "diazo"
