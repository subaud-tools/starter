# kempt.toml: the subaud starter. Sets up a machine for the subaud suite:
# tmux, and every suite tool with its release setup (skills, Claude Code
# plugin, pi channel).
#
# https://subaud.tools/setup.sh runs it, from the line on the account page:
#
#   curl -fsSL https://subaud.tools/setup.sh | sh -s -- <key>
#
# setup.sh signs the machine in to subaud.tools (every download below is gated
# on that sign-in), installs Homebrew on a Mac and tmux, and Claude Code when no
# agent is there, then runs
#   kempt init -yes -profile suite https://github.com/subaud-tools/starter.git
# and opens the agent on "Get me started with subaud."

[kempt]
spec = 2

# ---------------------------------------------------------------------------
# core: tmux, and a check that an agent is here: Claude Code or pi. setup.sh
# installs Claude Code with Anthropic's installer when neither is (kempt runs
# no install scripts).
# ---------------------------------------------------------------------------
[packages.core]
description = "tmux, and an agent (Claude Code or pi)"

  [[packages.core.install]]
  brew.formulas = ["tmux"]
  apt = ["tmux"]

  [[packages.core.verify]]
  command-exists = "tmux"

  [[packages.core.verify]]
  command-exists-any = ["claude", "pi"]

# ---------------------------------------------------------------------------
# terminal: what proj needs around it. proj opens sessions in Ghostty and runs
# yazi in its sidebar. FiraCode Nerd Font is the font the Ghostty config names
# and carries the icons yazi draws. A config already at either path is backed
# up before the link replaces it.
# ---------------------------------------------------------------------------
[packages.terminal]
description = "Ghostty (Mac) and yazi, with FiraCode Nerd Font"
needs = ["core"]

  # Linux: Ghostty is a Mac cask here, and yazi is not in Ubuntu 24.04's
  # apt; both stay Mac-only.
  [[packages.terminal.install]]
  brew.formulas = ["yazi"]
  brew.casks = ["ghostty", "font-fira-code-nerd-font"]
  only = { os = "darwin" }

  [[packages.terminal.symlink]]
  from = "config/ghostty/config"
  to = "~/.config/ghostty/config"
  backup = true
  only = { os = "darwin" }

  [[packages.terminal.symlink]]
  from = "config/yazi"
  to = "~/.config/yazi"
  backup = true

  [[packages.terminal.verify]]
  command-exists = "yazi"
  only = { os = "darwin" }

# ---------------------------------------------------------------------------
# way-of-working: the shared rules and the process skills, for Claude Code and
# pi alike. The rules file reaches Claude Code through one import line in
# ~/.claude/CLAUDE.md (the rest of that file stays yours) and pi as
# ~/.pi/agent/APPEND_SYSTEM.md (your ~/.pi/agent/AGENTS.md is never touched).
# Each skill is linked as its own folder, since tool releases write their own
# skills beside them; a folder already at a skill's path is backed up first.
# ---------------------------------------------------------------------------
[packages.way-of-working]
description = "The shared rules and the process skills, for Claude Code and pi"
needs = ["core"]

  [[packages.way-of-working.symlink]]
  from = "way-of-working.md"
  to = "~/.claude/subaud-way-of-working.md"
  backup = true

  [[packages.way-of-working.line-in-file]]
  file = "~/.claude/CLAUDE.md"
  line = "@~/.claude/subaud-way-of-working.md"

  [[packages.way-of-working.symlink]]
  from = "way-of-working.md"
  to = "~/.pi/agent/APPEND_SYSTEM.md"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/brainstorming"
  to = "~/.claude/skills/brainstorming"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/brainstorming"
  to = "~/.pi/agent/skills/brainstorming"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/writing-plans"
  to = "~/.claude/skills/writing-plans"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/writing-plans"
  to = "~/.pi/agent/skills/writing-plans"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/executing-plans"
  to = "~/.claude/skills/executing-plans"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/executing-plans"
  to = "~/.pi/agent/skills/executing-plans"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/test-driven-development"
  to = "~/.claude/skills/test-driven-development"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/test-driven-development"
  to = "~/.pi/agent/skills/test-driven-development"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/systematic-debugging"
  to = "~/.claude/skills/systematic-debugging"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/systematic-debugging"
  to = "~/.pi/agent/skills/systematic-debugging"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/receiving-code-review"
  to = "~/.claude/skills/receiving-code-review"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/receiving-code-review"
  to = "~/.pi/agent/skills/receiving-code-review"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/remembering"
  to = "~/.claude/skills/remembering"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/remembering"
  to = "~/.pi/agent/skills/remembering"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/running-long-jobs"
  to = "~/.claude/skills/running-long-jobs"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/running-long-jobs"
  to = "~/.pi/agent/skills/running-long-jobs"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/pi-subagent-dispatch"
  to = "~/.claude/skills/pi-subagent-dispatch"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/pi-subagent-dispatch"
  to = "~/.pi/agent/skills/pi-subagent-dispatch"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/cleaning-up-branches"
  to = "~/.claude/skills/cleaning-up-branches"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/cleaning-up-branches"
  to = "~/.pi/agent/skills/cleaning-up-branches"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/driving-chrome"
  to = "~/.claude/skills/driving-chrome"
  backup = true

  [[packages.way-of-working.symlink]]
  from = "skills/driving-chrome"
  to = "~/.pi/agent/skills/driving-chrome"
  backup = true

  [[packages.way-of-working.verify]]
  symlink-target = { link = "~/.pi/agent/APPEND_SYSTEM.md", target = "way-of-working.md" }

# ---------------------------------------------------------------------------
# The suite. Each download is a family release from its own site; setup = true
# takes the setup the release publishes beside the binary.
# ---------------------------------------------------------------------------
[packages.kempt]
description = "kempt: keeps this machine matching this file (kempt.tools)"

  # kempt publishes no setup bundle; its installer already put it here, and
  # this step keeps `kempt update` rolling it.
  [[packages.kempt.download]]
  site = "kempt.tools"
  tool = "kempt"
  bin = "kempt"

  [[packages.kempt.verify]]
  command-exists = "kempt"

[packages.muster]
description = "muster: messages between agent sessions on this machine (muster.tools)"
needs = ["core"]

  [[packages.muster.download]]
  site = "muster.tools"
  tool = "muster"
  bin = "muster"
  setup = true

  [[packages.muster.verify]]
  command-exists = "muster"

[packages.galley]
description = "galley: review a document with your agent on a page (galley.tools)"
needs = ["core"]

  [[packages.galley.download]]
  site = "galley.tools"
