name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: skills load in pi
        uses: subaud-tools/tools-actions/skill-check@v0.19.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install jsonschema==4.25.1
      - name: manifest
        run: python .github/check.py manifest
      - name: no private text
        run: python .github/check.py private
